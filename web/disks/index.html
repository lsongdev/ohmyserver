{{define "page"}}
<h2>Storage</h2>

<div class="grid grid-cols-2 sm-grid-cols-1">
  {{range .disks}}
  <div class="card">
    <div>
      <div>
        <a href="/disks/detail?device={{.Device}}">
          <h3>{{.Device}}</h3>
        </a>
        <div>
          <code class="badge">{{.FSType}}</code>
          <span class="text-muted"><em>{{.MountPoint}}</em></span>
        </div>
      </div>
    </div>

    <div>
      <div>
        <span class="text-muted">{{printf "%.1f%%" .UsePercent}} used</span>
        <span class="text-muted">{{printf "%.2f GB" .UsedGB}} / {{printf "%.2f GB" .TotalGB}}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill {{if gt .UsePercent 90.0}}danger{{else if gt .UsePercent 70.0}}warning{{end}}"
          style="width: {{.UsePercent}}%;"></div>
      </div>
      <div class="text-muted">
        {{printf "%.2f GB free" .FreeGB}}
      </div>
    </div>
  </div>
  {{end}}
</div>
<style>
.card a {
  color: #333;
  text-decoration: none;
}
</style>
{{end}}
