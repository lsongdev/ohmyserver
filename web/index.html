{{define "page"}}

<div class="page-header">
    <h2>Dashboard</h2>
</div>

{{if .widgets}}
<div class="grid grid-3 gap-10">
    {{range .widgets}}
    <div class="card">
        <div class="card-header">
            <b>{{.Name}}</b>
            <span class="badge badge-secondary">{{.Type}}</span>
        </div>
        <div class="card-body">
            <div class="flex-y gap-5">
                <div><strong>ID:</strong> {{.ID}}</div>
                <div><strong>Order:</strong> {{.SortOrder}}</div>
                {{if .Config}}
                <div><strong>Config:</strong>
                    <pre class="widget-config">{{.Config}}</pre>
                </div>
                {{else}}
                <p class="empty-message">No config</p>
                {{end}}
            </div>
        </div>
    </div>
    {{end}}
</div>
{{end}}

<style>
.widget-config {
    background: #f6f8fa;
    padding: 8px;
    border-radius: 4px;
    font-size: 12px;
    max-height: 80px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    margin: 4px 0 0 0;
}
.empty-state {
    text-align: center;
    padding: 48px 16px;
    color: #586069;
}
</style>

{{end}}
