{{define "page"}}

<div class="page-header">
    <h2>{{if .server}}Edit{{else}}Add{{end}} iDRAC Server</h2>
</div>

{{if .error}}
<div class="error-message">{{.error}}</div>
{{end}}

<form method="POST" action="{{if .server}}/idrac/{{.server.ID}}/edit{{else}}/idrac/new{{end}}" class="idrac-form">
    <div class="form-group">
        <label for="name">Name</label>
        <input class="input" type="text" id="name" name="name" value="{{if .server}}{{.server.Name}}{{else if .name}}{{.name}}{{end}}" required placeholder="e.g., Production Server 1">
        <p class="help-text">Descriptive name for this server</p>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="host">Host/IP</label>
            <input class="input" type="text" id="host" name="host" value="{{if .server}}{{.server.Host}}{{else if .host}}{{.host}}{{end}}" required placeholder="192.168.1.100">
        </div>

        <div class="form-group">
            <label for="port">Port</label>
            <input class="input" type="number" id="port" name="port" value="{{if .server}}{{.server.Port}}{{else if .port}}{{.port}}{{else}}443{{end}}" required placeholder="443">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="username">Username</label>
            <input class="input" type="text" id="username" name="username" value="{{if .server}}{{.server.Username}}{{else if .username}}{{.username}}{{end}}" required placeholder="root">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" name="password" {{if .server}}placeholder="Leave blank to keep current"{{else}}required{{end}}>
            {{if .server}}<p class="help-text">Leave blank to keep current password</p>{{end}}
        </div>
    </div>

    <div class="form-group">
        <label for="version">iDRAC Version</label>
        <select class="input" id="version" name="version" required>
            {{with .server}}
            <option value="7" {{if eq .Version "7"}}selected{{end}}>iDRAC 7</option>
            <option value="8" {{if eq .Version "8"}}selected{{end}}>iDRAC 8</option>
            <option value="9" {{if eq .Version "9"}}selected{{end}}>iDRAC 9</option>
            {{else}}
            <option value="7" {{if eq .version "7"}}selected{{end}}>iDRAC 7</option>
            <option value="8" {{if eq .version "8"}}selected{{end}}>iDRAC 8</option>
            <option value="9" {{if or (eq .version "9") (not .version)}}selected{{end}}>iDRAC 9</option>
            {{end}}
        </select>
        <p class="help-text">Select the iDRAC version for this server</p>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <input class="input" type="text" id="description" name="description" value="{{if .server}}{{.server.Description}}{{else if .description}}{{.description}}{{end}}" placeholder="Optional description">
    </div>

    <div class="form-actions">
        <button type="submit" class="button button-primary">{{if .server}}Update{{else}}Create{{end}} Server</button>
        <a href="/idrac" class="button button-secondry">Cancel</a>
    </div>
</form>

{{end}}
