{{define "page"}}
<nav class="sub-nav">
  <a href="/llm/chat">Chat</a>
  <a href="/llm/providers">Providers</a>
  <a href="/llm/models">Models</a>
  <a href="/llm/keys">API Keys</a>
</nav>

<div class="page-header">
  <h2>New API Key</h2>
</div>

{{if .error}}
<div class="alert alert-error">{{.error}}</div>
{{end}}

<form method="post">
  <div class="form-group">
    <label>Name</label>
    <input class="input" type="text" name="name" value="{{if .name}}{{.name}}{{end}}" required placeholder="My API Key">
  </div>
  <div class="form-actions">
    <button type="submit" class="button button-primary">Create</button>
    <a href="/llm/keys" class="button button-secondary">Cancel</a>
  </div>
</form>
{{end}}
