{{define "page"}}

<div class="page-header">
    <h2>OpenWrt Routers</h2>
    <a href="/openwrt/new" class="button">+ Add Router</a>
</div>

{{if .servers}}
<div class="table-container">
<table class="table table-striped table-bordered">
    <thead>
        <tr>
            <th>Name</th>
            <th>Last Updated</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {{range .servers}}
        <tr>
            <td>
                <a href="/openwrt/{{.ID}}"><b>{{.Name}}</b></a>
                <div><em>{{.Host}}:{{.Port}}</em></div>
            </td>
            <td>{{formatDate .UpdatedAt}}</td>
            <td class="actions">
                <a href="/openwrt/{{.ID}}/edit"  >Edit</a>
                <a method="delete" href="/openwrt/{{.ID}}" >Delete</a>
            </td>
        </tr>
        {{end}}
    </tbody>
</table>
</div>
{{else}}
<p class="empty-message">No OpenWrt routers configured. <a href="/openwrt/new">Add one</a></p>
{{end}}

{{end}}
