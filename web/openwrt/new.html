{{define "page"}}
{{if .server}}
<nav class="sub-nav">
    <a href="/openwrt/{{.server.ID}}">Overview</a>
    <a href="/openwrt/{{.server.ID}}/network">Network</a>
    <a href="/openwrt/{{.server.ID}}/dhcp">DHCP</a>
    
    <a href="/openwrt/{{.server.ID}}/packages">Packages</a>
    <a href="/openwrt/{{.server.ID}}/firewall">Firewall</a>
    <a href="/openwrt/{{.server.ID}}/edit">Settings</a>
</nav>
{{end}}

<div class="page-header">
    <h2>{{if .server}}Edit{{else}}Add{{end}} OpenWrt Router</h2>
</div>

{{if .error}}
<div class="error-message">{{.error}}</div>
{{end}}

<form method="POST" action="{{if .server}}/openwrt/{{.server.ID}}/edit{{else}}/openwrt/new{{end}}"  >
    <div class="form-group">
        <label for="name">Name</label>
        <input class="input" type="text" id="name" name="name" value="{{if .server}}{{.server.Name}}{{else if .name}}{{.name}}{{end}}" required placeholder="e.g., Main Router">
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="host">Host/IP</label>
            <input class="input" type="text" id="host" name="host" value="{{if .server}}{{.server.Host}}{{else if .host}}{{.host}}{{end}}" required placeholder="192.168.1.1">
        </div>
        <div class="form-group">
            <label for="port">Port</label>
            <input class="input" type="number" id="port" name="port" value="{{if .server}}{{.server.Port}}{{else if .port}}{{.port}}{{else}}80{{end}}" required>
        </div>
    </div>

    <div class="form-group">
        <label for="protocol">Protocol</label>
        <select class="input" id="protocol" name="protocol" required>
            {{with .server}}
            <option value="http" {{if eq .Protocol "http"}}selected{{end}}>HTTP</option>
            <option value="https" {{if eq .Protocol "https"}}selected{{end}}>HTTPS</option>
            {{else}}
            <option value="http" {{if or (eq .protocol "http") (not .protocol)}}selected{{end}}>HTTP</option>
            <option value="https" {{if eq .protocol "https"}}selected{{end}}>HTTPS</option>
            {{end}}
        </select>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="username">Username</label>
            <input class="input" type="text" id="username" name="username" value="{{if .server}}{{.server.Username}}{{else if .username}}{{.username}}{{end}}" required placeholder="root">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" name="password" {{if .server}}placeholder="Leave blank to keep current"{{else}}required{{end}}>
        </div>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <input class="input" type="text" id="description" name="description" value="{{if .server}}{{.server.Description}}{{else if .description}}{{.description}}{{end}}" placeholder="Optional description">
    </div>

    <div class="form-actions">
        <button type="submit" class="button button-primary">{{if .server}}Update{{else}}Create{{end}} Router</button>
        <a href="/openwrt" class="button">Cancel</a>
    </div>
</form>

{{end}}
