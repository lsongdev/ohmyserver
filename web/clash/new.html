{{define "page"}}

{{if .server}}
<nav class="sub-nav">
  <a href="/clash/{{.server.ID}}">Overview</a>
  <a href="/clash/{{.server.ID}}/proxies">Proxies</a>
  <a href="/clash/{{.server.ID}}/rules">Rules</a>
  <a href="/clash/{{.server.ID}}/connections">Connections</a>
  <a href="/clash/{{.server.ID}}/settings">Settings</a>
</nav>
{{end}}

<div class="page-header">
  <h2>{{if .server}}Settings{{else}}Add Clash Server{{end}}</h2>
</div>

{{if .error}}
<div class="error-message">{{.error}}</div>
{{end}}


{{if .server}}
<section class="section">
  <form action="/clash/{{.server.ID}}/config" method="POST">
    <div class="form-group">
      <label for="mode">Mode</label>
      <select class="input" id="mode" name="mode">
        <option value="direct" {{if eq .config.Mode "direct" }}selected{{end}}>Direct</option>
        <option value="rule" {{if eq .config.Mode "rule" }}selected{{end}}>Rule</option>
        <option value="global" {{if eq .config.Mode "global" }}selected{{end}}>Global</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mixedPort">Mixed Port</label>
      <input class="input" type="number" id="mixedPort" name="mixedPort" value="{{.config.MixedPort}}" min="0" max="65535">
    </div>

    <div class="form-group">
      <label for="port">Port (HTTP)</label>
      <input class="input" type="number" id="port" name="port" value="{{.config.Port}}" min="0" max="65535">
    </div>

    <div class="form-group">
      <label for="socksPort">Socks Port</label>
      <input class="input" type="number" id="socksPort" name="socksPort" value="{{.config.SocksPort}}" min="0" max="65535">
    </div>

    <div class="form-group">
      <label for="redirPort">Redir Port</label>
      <input class="input" type="number" id="redirPort" name="redirPort" value="{{.config.RedirPort}}" min="0" max="65535">
    </div>

    <div class="form-group">
      <label for="logLevel">Log Level</label>
      <select class="input" id="logLevel" name="logLevel">
        <option value="silent" {{if eq .config.LogLevel "silent" }}selected{{end}}>Silent</option>
        <option value="error" {{if eq .config.LogLevel "error" }}selected{{end}}>Error</option>
        <option value="warning" {{if eq .config.LogLevel "warning" }}selected{{end}}>Warning</option>
        <option value="info" {{if eq .config.LogLevel "info" }}selected{{end}}>Info</option>
        <option value="debug" {{if eq .config.LogLevel "debug" }}selected{{end}}>Debug</option>
      </select>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" name="allowLan" value="true" {{if .config.AllowLan}}checked{{end}}>
        Allow LAN
      </label>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" name="ipv6" value="true" {{if .config.Ipv6}}checked{{end}}>
        IPv6
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="button button-primary">Save</button>
      <a href="/clash/{{.server.ID}}" class="button button-secondary">Cancel</a>
    </div>
  </form>
</section>
{{end}}

<section class="section">

  <form method="POST">
    <div class="form-group">
      <label for="name">Name *</label>
      <input class="input" type="text" id="name" name="name" value="{{if .server}}{{.server.Name}}{{else if .name}}{{.name}}{{end}}"
        placeholder="My Clash Server" required>
    </div>

    <div class="form-group">
      <label for="api_url">API URL *</label>
      <input class="input" type="text" id="api_url" name="api_url"
        value="{{if .server}}{{.server.APIURL}}{{else if .apiURL}}{{.apiURL}}{{end}}"
        placeholder="http://192.168.2.1:7880" required>
    </div>

    <div class="form-group">
      <label for="secret">Secret</label>
      <input class="input" type="password" id="secret" name="secret" value="{{if .server}}{{else if .secret}}{{.secret}}{{end}}"
        placeholder="{{if .server}}Leave blank to keep existing secret{{else}}clash@lsong.org{{end}}">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea class="input" id="description" name="description" rows="3"
        placeholder="Optional description">{{if .server}}{{.server.Description}}{{else if .description}}{{.description}}{{end}}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="button button-primary">{{if .server}}Update{{else}}Create{{end}}</button>
      {{if .server}}
      <a method="delete" href="/clash" class="button button-danger">Delete</a>
      {{else}}
      <a href="/clash" class="button button-secondary">Cancel</a>
      {{end}}
    </div>
  </form>
</section>

{{end}}
