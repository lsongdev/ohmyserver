{{define "page"}}

<nav class="sub-nav">
    <a href="/clash/{{.server.ID}}">Overview</a>
    <a href="/clash/{{.server.ID}}/proxies">Proxies</a>
    <a href="/clash/{{.server.ID}}/rules">Rules</a>
    <a href="/clash/{{.server.ID}}/connections" class="active">Connections</a>
    <a href="/clash/{{.server.ID}}/settings">Settings</a>
</nav>

<h2>Connections</h2>

<div class="stats mb-10">
    <div class="card">
        <div class="stat-label">Upload Total</div>
        <div class="stat-value" id="upload-total">-</div>
    </div>
    <div class="card">
        <div class="stat-label">Download Total</div>
        <div class="stat-value" id="download-total">-</div>
    </div>
    <div class="card">
        <div class="stat-label">Active Connections</div>
        <div class="stat-value" id="conn-count">-</div>
    </div>
</div>

<div id="connections-container">
    <div class="empty-state">Loading connections...</div>
</div>

<style>
.conn-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.conn-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}
.conn-meta {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: #666;
}
.conn-meta-item {
    display: flex;
    gap: 4px;
}
.conn-meta-label {
    color: #999;
}
.conn-chains {
    margin-top: 8px;
}
.conn-chains .badge {
    margin-right: 4px;
    margin-bottom: 4px;
    display: inline-block;
}

</style>

<script>
(function() {
    var serverId = '{{.server.ID}}';
    var connMap = {}; // Track existing cards by connection id

    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        var k = 1024;
        var sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        var i = Math.floor(Math.log(bytes) / Math.log(k));
        return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function buildCardHtml(conn) {
        var meta = conn.metadata || {};
        var host = meta.host || meta.destinationIP || '';
        var port = meta.destinationPort || '';

        var chains = '';
        if (conn.chains && conn.chains.length > 0) {
            for (var j = 0; j < conn.chains.length; j++) {
                chains += '<span class="badge">' + escapeHtml(conn.chains[j]) + '</span>';
            }
        }

        var html = '<div class="card">';
        html += '<div class="conn-header">';
        html += '<div class="conn-host">' + escapeHtml(host) + (port ? ':' + escapeHtml(port) : '') + '</div>';
        html += '<div class="conn-meta text-nowrap">';
        
        html += '<span class="conn-meta-item"><i class="fas fa-upload"></i><span data-field="upload">' + formatBytes(conn.upload || 0) + '</span></span>';
        html += '<span class="conn-meta-item"><i class="fas fa-download"></i><span data-field="download">' + formatBytes(conn.download || 0) + '</span></span>';
        html += '</div></div>';
        if (chains) {
            html += '<span class="badge" >' + escapeHtml(conn.rule || '-') + ' ➜ </span>';
            html += '<span class="conn-chains">' + chains + '</span>';
        }
        html += '</div>';
        return html;
    }

    function updateCard(conn) {
        var el = connMap[conn.id];
        if (!el) return;
        var uploadEl = el.querySelector('[data-field="upload"]');
        var downloadEl = el.querySelector('[data-field="download"]');
        if (uploadEl) uploadEl.textContent = formatBytes(conn.upload || 0);
        if (downloadEl) downloadEl.textContent = formatBytes(conn.download || 0);
    }

    function renderConnections(conns) {
        if (!conns) conns = [];

        var currentIds = {};
        for (var i = 0; i < conns.length; i++) {
            currentIds[conns[i].id] = true;
        }

        // Remove cards for connections that no longer exist
        var container = document.getElementById('connections-container');
        var toRemove = [];
        for (var id in connMap) {
            if (!currentIds[id]) {
                toRemove.push(id);
            }
        }
        for (var r = 0; r < toRemove.length; r++) {
            var el = connMap[toRemove[r]];
            if (el && el.parentNode) el.parentNode.removeChild(el);
            delete connMap[toRemove[r]];
        }

        // Handle empty state
        var emptyState = container.querySelector('.empty-state');

        if (conns.length === 0) {
            // Remove all cards
            var existingCards = container.querySelectorAll('.conn-card');
            for (var e = 0; e < existingCards.length; e++) {
                if (existingCards[e].parentNode) existingCards[e].parentNode.removeChild(existingCards[e]);
            }
            // Remove grid wrapper if exists
            var grid = container.querySelector('.conn-list');
            if (grid) grid.remove();
            if (emptyState) {
                emptyState.textContent = 'No active connections.';
            } else {
                var es = document.createElement('div');
                es.className = 'empty-state';
                es.textContent = 'No active connections.';
                container.appendChild(es);
            }
            return;
        }

        // Remove empty state if exists
        if (emptyState) emptyState.remove();

        // Create wrapper list if it doesn't exist
        var list = container.querySelector('.conn-list');
        if (!list) {
            list = document.createElement('div');
            list.className = 'conn-list';
            container.appendChild(list);
        }

        // Add/update cards
        for (var i = 0; i < conns.length; i++) {
            var conn = conns[i];
            if (connMap[conn.id]) {
                // Existing card, just update values
                updateCard(conn);
            } else {
                // New card, insert at top
                var temp = document.createElement('div');
                temp.innerHTML = buildCardHtml(conn);
                var card = temp.firstChild;
                connMap[conn.id] = card;
                if (list.firstChild) {
                    list.insertBefore(card, list.firstChild);
                } else {
                    list.appendChild(card);
                }
            }
        }
    }

    function connectSSE() {
        var eventSource = new EventSource('/clash/' + serverId + '/stream');

        eventSource.addEventListener('traffic', function(event) {
            try {
                var data = JSON.parse(event.data);
                console.log('Speed:', data.uploadSpeed, data.downloadSpeed);
            } catch (e) {
                console.error('Failed to parse traffic data:', e);
            }
        });

        eventSource.addEventListener('connections', function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.connections) {
                    renderConnections(data.connections);
                }
                document.getElementById('upload-total').textContent = formatBytes(data.uploadTotal || 0);
                document.getElementById('download-total').textContent = formatBytes(data.downloadTotal || 0);
                document.getElementById('conn-count').textContent = data.connCount || 0;
            } catch (e) {
                console.error('Failed to parse connections data:', e);
            }
        });

        eventSource.addEventListener('error', function() {
            console.error('SSE stream error');
            eventSource.close();
            setTimeout(connectSSE, 5000);
        });
    }

    if (serverId) {
        connectSSE();
    }
})();
</script>
{{end}}
