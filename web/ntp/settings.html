{{define "page"}}

<nav>
  <a href="/ntp">overview</a>
  <a href="/ntp/settings">settings</a>
</nav>

<h2>NTP Settings</h2>

<form class="form" method="POST" action="/ntp/settings">
  <div class="form-group">
    <label>
      <input type="checkbox" name="enabled" value="1" {{if .settings.Enabled}}checked{{end}}>
      Enable NTP server
    </label>
  </div>
  <div class="form-group">
    <label for="listen_addr">UDP listen address</label>
    <input class="input" id="listen_addr" name="listen_addr" value="{{.settings.ListenAddr}}" placeholder=":123" required>
  </div>
  <div class="grid grid-2 gap-10">
    <div class="form-group">
      <label for="stratum">Stratum</label>
      <input class="input" type="number" id="stratum" name="stratum" min="1" max="15" value="{{.settings.Stratum}}" required>
    </div>
    <div class="form-group">
      <label for="reference_id">Reference ID</label>
      <input class="input" id="reference_id" name="reference_id" minlength="4" maxlength="4" value="{{.settings.ReferenceID}}" required>
      <small>Exactly four ASCII characters, for example <code>LOCL</code>.</small>
    </div>
  </div>
  <div class="form-actions">
    <button class="button button-primary" type="submit">Save and reload</button>
    <a class="button" href="/ntp">Cancel</a>
  </div>
</form>

{{end}}
