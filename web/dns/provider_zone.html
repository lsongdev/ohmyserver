{{define "page"}}
<nav>
  <a href="/dns">overview</a>
  <a href="/dns/zones">zones</a>
  <a href="/dns/providers">providers</a>
  <a href="/dns/filters">filters</a>
  <a href="/dns/settings">settings</a>
</nav>

<div class="page-header">
  <div>
    <h2>{{.zoneName}}</h2>
    <p>Hosted by <a href="/dns/providers/{{.provider.ID}}">{{.provider.Name}}</a></p>
  </div>
</div>

<section class="section">
  <h3>New record</h3>
  <form class="form" method="post" action="/dns/providers/{{.provider.ID}}/zones/{{.zoneKey}}">
    <div class="grid grid-3 gap-10">
      <div class="form-group"><label for="type">Type</label><input class="input" type="text" id="type" name="type" value="TXT" required></div>
      <div class="form-group"><label for="name">Name</label><input class="input" type="text" id="name" name="name" value="@" required></div>
      <div class="form-group"><label for="ttl">TTL</label><input class="input" type="number" id="ttl" name="ttl" value="300" min="1" required></div>
    </div>
    <div class="form-group"><label for="value">Value</label><input class="input" type="text" id="value" name="value" required></div>
    <div class="form-group"><label for="comment">Comment</label><input class="input" type="text" id="comment" name="comment"></div>
    <button class="button button-primary" type="submit">Add record</button>
  </form>
</section>

{{if .records}}
<div class="table-container">
  <table class="table">
    <thead><tr><th>Name</th><th>Type</th><th>Value</th><th>TTL</th><th>Actions</th></tr></thead>
    <tbody>
      {{range .records}}
      <tr>
        <td><code>{{.Name}}</code></td><td>{{.Type}}</td><td><code>{{.Value}}</code></td><td>{{.TTL}}</td>
        <td>
          <a method="delete" href="/dns/providers/{{$.provider.ID}}/zones/{{$.zoneKey}}?record_id={{.ID}}" class="button button-danger" onclick="return confirm('Delete this record?')">Delete</a>
        </td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{else}}
<p class="empty-message">No records returned by this provider.</p>
{{end}}
{{end}}
