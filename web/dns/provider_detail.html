{{define "page"}}
<nav>
  <a href="/dns">overview</a>
  <a href="/dns/zones">zones</a>
  <a href="/dns/providers">providers</a>
  <a href="/dns/filters">filters</a>
  <a href="/dns/settings">settings</a>
</nav>

<div class="page-header">
  <div>
    <h2>{{.provider.Name}}</h2>
    <p>{{.provider.Type}} hosted zones</p>
  </div>
</div>

{{if .zones}}
<div class="table-container">
  <table class="table">
    <thead><tr><th>Zone</th><th>External ID</th><th>Created</th></tr></thead>
    <tbody>
      {{range .zones}}
      <tr>
        <td><a href="/dns/providers/{{$.provider.ID}}/zones/{{base64url .ID}}"><b>{{.Name}}</b></a></td>
        <td><code>{{.ID}}</code></td>
        <td>{{.CreatedAt}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{else}}
<p class="empty-message">This connection returned no hosted zones.</p>
{{end}}
{{end}}
