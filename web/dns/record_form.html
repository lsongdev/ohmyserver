{{define "page"}}

<nav>
  <a href="/dns">overview</a>
  <a href="/dns/zones">zones</a>
  <a href="/dns/providers">providers</a>
  <a href="/dns/filters">filters</a>
  <a href="/dns/settings">settings</a>
</nav>

<h2>{{if .record}}Edit{{else}}New{{end}} DNS Record</h2>
<p>Zone: <a href="/dns/zones/{{.zone.ID}}">{{.zone.Name}}</a></p>

<form class="form" method="POST" action="{{if .record}}/dns/records/{{.record.ID}}/edit{{else}}/dns/zones/{{.zone.ID}}/records/new{{end}}">
  <div class="grid grid-3 gap-10">
    <div class="form-group">
      <label for="name">Name</label>
      <input class="input" type="text" id="name" name="name" required value="{{if .record}}{{.record.Name}}{{else}}@{{end}}" placeholder="@ or host">
    </div>
    <div class="form-group">
      <label for="type">Type</label>
      <select class="input" id="type" name="type" required>
        {{$selected := ""}}{{if .record}}{{$selected = .record.Type}}{{end}}
        {{range $type := (split "A,AAAA,CNAME,MX,NS,TXT,PTR,SOA,SRV" ",")}}
        <option value="{{$type}}" {{if eq $selected $type}}selected{{end}}>{{$type}}</option>
        {{end}}
      </select>
    </div>
    <div class="form-group">
      <label for="ttl">TTL</label>
      <input class="input" type="number" min="1" id="ttl" name="ttl" value="{{if .record}}{{.record.TTL}}{{else}}300{{end}}">
    </div>
  </div>
  <div class="form-group">
    <label for="value">Value</label>
    <input class="input" type="text" id="value" name="value" required value="{{if .record}}{{.record.Value}}{{end}}" placeholder="192.0.2.1, target.example.com., or text">
  </div>
  <div class="grid grid-3 gap-10">
    <div class="form-group">
      <label for="priority">Priority (MX/SRV)</label>
      <input class="input" type="number" min="0" id="priority" name="priority" value="{{if .record}}{{.record.Priority}}{{else}}0{{end}}">
    </div>
    <div class="form-group">
      <label for="weight">Weight (SRV)</label>
      <input class="input" type="number" min="0" id="weight" name="weight" value="{{if .record}}{{.record.Weight}}{{else}}0{{end}}">
    </div>
    <div class="form-group">
      <label for="port">Port (SRV)</label>
      <input class="input" type="number" min="0" max="65535" id="port" name="port" value="{{if .record}}{{.record.Port}}{{else}}0{{end}}">
    </div>
  </div>
  <div class="form-group">
    <label>
<input type="checkbox" name="enabled" value="1" {{if .record}}{{if .record.Enabled}}checked{{end}}{{else}}checked{{end}}>
      Enabled
    </label>
  </div>
  <div class="form-actions">
    <button class="button button-primary" type="submit">Save record</button>
    <a class="button" href="/dns/zones/{{.zone.ID}}">Cancel</a>
  </div>
</form>

{{end}}
