{{define "page"}}

<nav>
  <a href="/dns">overview</a>
  <a href="/dns/zones">zones</a>
  <a href="/dns/providers">providers</a>
  <a href="/dns/filters">filters</a>
  <a href="/dns/settings">settings</a>
</nav>

<h2>{{if .subscription}}Edit{{else}}New{{end}} Filter Subscription</h2>

<form class="form" method="POST" action="{{if .subscription}}/dns/filters/subscriptions/{{.subscription.ID}}/edit{{else}}/dns/filters/subscriptions/new{{end}}">
  <div class="form-group">
    <label for="name">Name</label>
    <input class="input" type="text" id="name" name="name" required value="{{if .subscription}}{{.subscription.Name}}{{end}}" placeholder="Threat intelligence feed">
  </div>
  <div class="form-group">
    <label for="kind">Kind</label>
    <select class="input" id="kind" name="kind">
      <option value="block" {{if .subscription}}{{if eq .subscription.Kind "block"}}selected{{end}}{{end}}>Block list</option>
      <option value="allow" {{if .subscription}}{{if eq .subscription.Kind "allow"}}selected{{end}}{{end}}>Allow list</option>
    </select>
  </div>
  <div class="form-group">
    <label for="url">Source URL</label>
    <input class="input" type="url" id="url" name="url" required value="{{if .subscription}}{{.subscription.URL}}{{end}}" placeholder="https://example.com/domains.txt">
  </div>
  <div class="form-group">
    <label for="refresh_hours">Refresh interval (hours)</label>
    <input class="input" type="number" min="1" id="refresh_hours" name="refresh_hours" value="{{if .subscription}}{{.subscription.RefreshHours}}{{else}}24{{end}}">
  </div>
  <div class="form-group">
    <label>
<input type="checkbox" name="enabled" value="1" {{if .subscription}}{{if .subscription.Enabled}}checked{{end}}{{else}}checked{{end}}>
      Enabled
    </label>
  </div>
  <div class="form-actions">
    <button class="button button-primary" type="submit">Save subscription</button>
    <a class="button" href="/dns/filters">Cancel</a>
  </div>
</form>

{{end}}
