{{define "page"}}
<nav>
  <a href="/dns">overview</a>
  <a href="/dns/zones">zones</a>
  <a href="/dns/providers">providers</a>
  <a href="/dns/filters">filters</a>
  <a href="/dns/settings">settings</a>
</nav>

<h2>New DNS Provider Connection</h2>
{{if .error}}<div class="error-message">{{.error}}</div>{{end}}

<form class="form" method="post" action="/dns/providers/new">
  <div class="form-group">
    <label for="name">Connection name</label>
    <input class="input" type="text" id="name" name="name" required value="{{if .name}}{{.name}}{{end}}" placeholder="Cloudflare Production">
  </div>
  <div class="form-group">
    <label for="type">Provider</label>
    <select class="input" id="type" name="type" required>
      <option value="cloudflare" {{if eq .type "cloudflare"}}selected{{end}}>Cloudflare</option>
      <option value="dnspod" {{if eq .type "dnspod"}}selected{{end}}>DNSPod</option>
      <option value="namecom" {{if eq .type "namecom"}}selected{{end}}>Name.com</option>
    </select>
  </div>
  <div class="form-group provider-field provider-cloudflare">
    <label for="email">Cloudflare account email (global API key only)</label>
    <input class="input" type="email" id="email" name="email">
  </div>
  <div class="form-group provider-field provider-cloudflare">
    <label for="api_key">Cloudflare global API key (optional)</label>
    <input class="input" type="password" id="api_key" name="api_key">
  </div>
  <div class="form-group provider-field provider-namecom">
    <label for="user">Name.com username</label>
    <input class="input" type="text" id="user" name="user">
  </div>
  <div class="form-group">
    <label for="token">API token</label>
    <input class="input" type="password" id="token" name="token">
  </div>
  <div class="form-actions">
    <button class="button button-primary" type="submit">Save connection</button>
    <a class="button" href="/dns/providers">Cancel</a>
  </div>
</form>

<script>
  (function () {
    var select = document.getElementById('type');
    function updateFields() {
      document.querySelectorAll('.provider-field').forEach(function (field) {
        field.hidden = !field.classList.contains('provider-' + select.value);
      });
    }
    select.addEventListener('change', updateFields);
    updateFields();
  })();
</script>
{{end}}
