{{define "page"}}

<nav>
    <a href="/projects/{{.project.ID}}">overview</a>
    <a href="/projects/{{.project.ID}}/deployments">deployments</a>
    <a href="/projects/{{.project.ID}}/settings" >settings</a>
</nav>

<h2>Project Settings</h2>
<form action="/projects/{{.project.ID}}/settings" method="post">
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" class="input" value="{{.project.Name}}" required>
  </div>
  <div class="form-group">
    <label for="description">Description</label>
    <textarea id="description" name="description" class="input">{{.project.Description}}</textarea>
  </div>
  <div class="form-group">
    <label for="repo">Repository URL</label>
    <input type="text" id="repo" name="repo" class="input" value="{{.project.Repo}}" placeholder="https://github.com/user/repo.git">
    <small class="form-hint">Repository root must contain a Dockerfile.</small>
  </div>

  <h3>GitHub Webhook</h3>
  <div class="form-group">
    <label for="webhook_url">Payload URL</label>
    <input type="text" id="webhook_url" class="input" value="{{.webhookURL}}" readonly>
  </div>
  <div class="form-group">
    <label for="webhook_branch">Branch</label>
    <input type="text" id="webhook_branch" name="webhook_branch" class="input" value="{{.project.WebhookBranch}}" required>
  </div>
  <div class="form-group">
    <label for="current_webhook_secret">Secret</label>
    <input type="text" id="current_webhook_secret" class="input" value="{{.project.WebhookSecret}}" readonly>
  </div>
  <div class="form-group">
    <label for="webhook_secret">New Secret</label>
    <input type="password" id="webhook_secret" name="webhook_secret" class="input">
    <small class="form-hint">Leave blank to keep the current secret.</small>
  </div>

  <div class="form-actions">
    <button type="submit" class="button button-primary">Update Project</button>
    <a href="/projects/{{.project.ID}}" class="button">Cancel</a>
  </div>
</form>

<div class="form-group">
  <a method="delete" href="/projects/{{.project.ID}}" class="button button-danger" onclick="return confirm('Delete this project?')">Delete Project</a>
</div>

{{end}}
