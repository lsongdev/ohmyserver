{{define "page"}}
<h2>Create Project</h2>
<form action="/projects/new" method="post">
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" class="input" required>
  </div>
  <div class="form-group">
    <label for="description">Description</label>
    <textarea id="description" name="description" class="input"></textarea>
  </div>
  <div class="form-group">
    <label for="repo">Repository URL</label>
    <input type="text" id="repo" name="repo" class="input" placeholder="https://github.com/user/repo.git">
    <small class="form-hint">Git repository URL for automatic deployment</small>
  </div>

  <button type="submit" class="button button-primary">Create Project</button>
</form>
{{end}}
