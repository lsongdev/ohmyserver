{{define "page"}}

<div class="page-header">
    <h2>Proxmox VE Servers</h2>
    <a href="/pve/new" class="button">+ Add Server</a>
</div>

{{if .servers}}
<div class="table-container">
    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Last Updated</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {{range .servers}}
            <tr>
                <td>
                    <a href="/pve/{{.ID}}"><strong>{{.Name}}</strong></a>
                    <div><em>{{.Username}}@{{.Host}}:{{.Port}}</em></div>
                </td>
                <td>{{ .UpdatedAt | formatTime}}</td>
                <td class="actions">
                    <a href="/pve/{{.ID}}/edit">edit</a>
                    <a href="/pve/{{.ID}}" method="delete">delete</a>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{else}}
<p class="empty-message">No PVE servers configured. <a href="/pve/new">Add one</a></p>
{{end}}

{{end}}
