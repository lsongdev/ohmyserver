{{define "page"}}

<div class="page-header">
    <h2>SSH Servers</h2>
    <div class="ssh-actions">
        <a href="/ssh/servers/new" class="button button-primary">+ Add Server</a>
    </div>
</div>

{{if .servers}}
<div class="table-container">
<table class="table table-striped table-bordered">
    <thead>
        <tr>
            <th>Name</th>
            <th>Last Updated</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {{range .servers}}
        <tr>
            <td>
                <a href="/ssh/servers/{{.ID}}"><strong>{{.Name}}</strong></a>
                <div><em>{{.Username}}@{{.Host}}:{{.Port}}</em></div>
            </td>
            <td>{{formatDate .UpdatedAt}}</td>
            <td class="actions">
                <a href="/ssh/servers/{{.ID}}/terminal">terminal</a>
                <a href="/ssh/servers/{{.ID}}/edit" title="edit">edit</a>
                <a method="delete" href="/ssh/servers/{{.ID}}" title="delete">delete</a>
            </td>
        </tr>
        {{end}}
    </tbody>
</table>
</div>
{{else}}
<p class="empty-message">No SSH servers configured. <a href="/ssh/servers/new">Create one</a></p>
{{end}}
<style>
</style>
{{end}}
