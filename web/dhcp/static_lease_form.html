{{define "page"}}

<nav>
  <a href="/dhcp">overview</a>
  <a href="/dhcp/leases">leases</a>
  <a href="/dhcp/static-leases">static leases</a>
  <a href="/dhcp/settings">settings</a>
</nav>

<h2>{{if .staticLease}}Edit Static Lease{{else}}New Static Lease{{end}}</h2>

<form class="form" method="POST" action="{{if .staticLease}}/dhcp/static-leases/{{.staticLease.ID}}/edit{{else}}/dhcp/static-leases/new{{end}}">
  <div class="form-group">
    <label for="mac">MAC address</label>
    <input class="input" id="mac" name="mac" value="{{if .staticLease}}{{.staticLease.MAC}}{{else if .mac}}{{.mac}}{{end}}" placeholder="00:11:22:33:44:55" required>
  </div>
  <div class="form-group">
    <label for="ip">IPv4 address</label>
    <input class="input" id="ip" name="ip" value="{{if .staticLease}}{{.staticLease.IP}}{{else if .ip}}{{.ip}}{{end}}" required>
    <small>The address must be inside the configured DHCP pool.</small>
  </div>
  <div class="form-group">
    <label for="hostname">Hostname</label>
    <input class="input" id="hostname" name="hostname" value="{{if .staticLease}}{{.staticLease.Hostname}}{{else if .hostname}}{{.hostname}}{{end}}">
  </div>
  <div class="form-group">
    <label for="description">Description</label>
    <input class="input" id="description" name="description" value="{{if .staticLease}}{{.staticLease.Description}}{{else if .description}}{{.description}}{{end}}">
  </div>
  <div class="form-actions">
    <button class="button button-primary" type="submit">Save</button>
    <a class="button" href="/dhcp/static-leases">Cancel</a>
  </div>
</form>

{{end}}
