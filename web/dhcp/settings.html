{{define "page"}}

<nav>
  <a href="/dhcp">overview</a>
  <a href="/dhcp/leases">leases</a>
  <a href="/dhcp/static-leases">static leases</a>
  <a href="/dhcp/settings">settings</a>
</nav>

<h2>DHCP Settings</h2>

<form class="form" method="POST" action="/dhcp/settings">
  <div class="form-group">
    <label>
      <input type="checkbox" name="enabled" value="1" {{if .settings.Enabled}}checked{{end}}>
      Enable DHCP server
    </label>
  </div>
  <div class="form-group">
    <label for="listen_addr">UDP listen address</label>
    <input class="input" id="listen_addr" name="listen_addr" value="{{.settings.ListenAddr}}" placeholder=":67" required>
  </div>
  <div class="form-group">
    <label for="server_ip">Server IPv4 address</label>
    <input class="input" id="server_ip" name="server_ip" value="{{.settings.ServerIP}}" required>
  </div>
  <div class="form-group">
    <label for="subnet_mask">Subnet mask</label>
    <input class="input" id="subnet_mask" name="subnet_mask" value="{{.settings.SubnetMask}}" required>
  </div>
  <div class="form-group">
    <label for="pool_start">Pool start</label>
    <input class="input" id="pool_start" name="pool_start" value="{{.settings.PoolStart}}" required>
  </div>
  <div class="form-group">
    <label for="pool_end">Pool end</label>
    <input class="input" id="pool_end" name="pool_end" value="{{.settings.PoolEnd}}" required>
  </div>
  <div class="form-group">
    <label for="router">Default gateway</label>
    <input class="input" id="router" name="router" value="{{.settings.Router}}">
  </div>
  <div class="form-group">
    <label for="broadcast_address">Broadcast address</label>
    <input class="input" id="broadcast_address" name="broadcast_address" value="{{.settings.BroadcastAddress}}">
  </div>
  <div class="form-group">
    <label for="dns_servers">DNS servers</label>
    <textarea class="input" id="dns_servers" name="dns_servers" rows="4">{{.settings.DNSServers}}</textarea>
    <small>One IPv4 address per line.</small>
  </div>
  <div class="form-group">
    <label for="ntp_servers">NTP servers</label>
    <textarea class="input" id="ntp_servers" name="ntp_servers" rows="4">{{.settings.NTPServers}}</textarea>
    <small>Advertised using DHCP option 42.</small>
  </div>
  <div class="form-group">
    <label for="domain_name">Domain name</label>
    <input class="input" id="domain_name" name="domain_name" value="{{.settings.DomainName}}">
  </div>
  <div class="form-group">
    <label for="lease_seconds">Lease duration (seconds)</label>
    <input class="input" type="number" min="60" id="lease_seconds" name="lease_seconds" value="{{.settings.LeaseSeconds}}" required>
  </div>
  <div class="form-group">
    <label for="renewal_seconds">Renewal time T1 (seconds)</label>
    <input class="input" type="number" min="1" id="renewal_seconds" name="renewal_seconds" value="{{.settings.RenewalSeconds}}" required>
  </div>
  <div class="form-group">
    <label for="rebinding_seconds">Rebinding time T2 (seconds)</label>
    <input class="input" type="number" min="1" id="rebinding_seconds" name="rebinding_seconds" value="{{.settings.RebindingSeconds}}" required>
  </div>
  <p><small>UDP port 67 normally requires root or <code>CAP_NET_BIND_SERVICE</code>. Do not enable this alongside another DHCP server on the same network.</small></p>
  <div class="form-actions">
    <button class="button button-primary" type="submit">Save and reload</button>
    <a class="button" href="/dhcp">Cancel</a>
  </div>
</form>

{{end}}
