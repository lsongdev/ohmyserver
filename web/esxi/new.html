{{define "page"}}

<div class="page-header">
    <h2>{{if .server}}Edit{{else}}New{{end}} ESXi Server</h2>
    <a href="/esxi" class="button button-secondary">← Back to List</a>
</div>

{{if .error}}
<div class="error-message">{{.error}}</div>
{{end}}

<form action="{{if .server}}/esxi/{{.server.ID}}/edit{{else}}/esxi/new{{end}}" method="POST" class="form">
    {{if .server}}
    <input type="hidden" name="_method" value="PUT">
    <input type="hidden" name="id" value="{{.server.ID}}">
    {{end}}

    <div class="form-group">
        <label for="name">Name *</label>
        <input class="input" type="text" id="name" name="name" value="{{if .server}}{{.server.Name}}{{else if .name}}{{.name}}{{end}}"
            required placeholder="e.g., ESXi Production">
    </div>



    <div class="form-row">


        <div class="form-group">
            <label for="host">Host *</label>
            <input class="input" type="text" id="host" name="host"
                value="{{if .server}}{{.server.Host}}{{else if .host}}{{.host}}{{end}}" required
                placeholder="e.g., esxi.example.com or 192.168.1.100">
        </div>

        <div class="form-group">
            <label for="port">Port</label>
            <input class="input" type="number" id="port" name="port"
                value="{{if .server}}{{.server.Port}}{{else if .port}}{{.port}}{{end}}" placeholder="443">
        </div>


    </div>

    <div class="form-row">
        <div class="form-group form-check">
            <input type="checkbox" id="insecure" name="insecure" {{if .server}}{{if
                .server.Insecure}}checked{{end}}{{else if .insecure}}checked{{end}}>
            <label for="insecure">Skip TLS Verification (for self-signed certificates)</label>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="username">Username *</label>
            <input class="input" type="text" id="username" name="username"
                value="{{if .server}}{{.server.Username}}{{else if .username}}{{.username}}{{end}}" required
                placeholder="e.g., root">
        </div>

        <div class="form-group">
            <label for="password">Password *</label>
            <input class="input" type="password" id="password" name="password" placeholder="••••••••" {{if not
                .server}}required{{end}}>
            {{if .server}}<small>Leave blank to keep existing password</small>{{end}}
        </div>
    </div>



    <div class="form-actions">
        <button type="submit" class="button button-primary">
            {{if .server}}Save Changes{{else}}Save{{end}}
        </button>
        <a href="/esxi" class="button button-secondary">Cancel</a>
    </div>
</form>

{{end}}
