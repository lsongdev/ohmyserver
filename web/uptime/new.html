{{define "page"}}
<div class="page-header">
  <h2>New Monitor</h2>
  <a href="/monitor/uptime" class="button">Back</a>
</div>

<form method="post" action="/monitor/uptime/new">
  <div class="form-group">
    <label>Name</label>
    <input type="text" name="name" placeholder="My Server" required>
  </div>

  <div class="form-group">
    <label>Type</label>
    <select name="type" id="monitor-type" required onchange="updateFields()">
      <option value="http">HTTP / HTTPS</option>
      <option value="tcp">TCP Port</option>
      <option value="ping">Ping (ICMP)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Target</label>
    <input type="text" name="target" placeholder="example.com or 192.168.1.1" required>
    <small id="target-help">Hostname or IP address to monitor</small>
  </div>

  <div class="form-group" id="port-group" style="display:none">
    <label>Port</label>
    <input type="number" name="port" value="80" min="1" max="65535">
  </div>

  <div class="form-group" id="status-group">
    <label>Expected HTTP Status</label>
    <input type="number" name="expected_status" value="200" min="100" max="599">
  </div>

  <div class="form-group">
    <label>Interval (seconds)</label>
    <input type="number" name="interval" value="60" min="10" max="3600">
  </div>

  <div class="form-group">
    <label>Timeout (seconds)</label>
    <input type="number" name="timeout" value="10" min="1" max="60">
  </div>

  <div class="form-group">
    <label>
      <input type="checkbox" name="enabled" checked>
      Enabled
    </label>
  </div>

  <div class="form-actions">
    <button type="submit" class="button button-primary">Create Monitor</button>
  </div>
</form>

<script>
function updateFields() {
  const type = document.getElementById('monitor-type').value;
  const portGroup = document.getElementById('port-group');
  const statusGroup = document.getElementById('status-group');
  const targetHelp = document.getElementById('target-help');

  if (type === 'tcp') {
    portGroup.style.display = 'block';
    statusGroup.style.display = 'none';
    targetHelp.textContent = 'Hostname or IP address';
  } else if (type === 'ping') {
    portGroup.style.display = 'none';
    statusGroup.style.display = 'none';
    targetHelp.textContent = 'Hostname or IP address to ping';
  } else {
    portGroup.style.display = 'none';
    statusGroup.style.display = 'block';
    targetHelp.textContent = 'URL or hostname (http:// or https:// will be added if missing)';
  }
}
updateFields();
</script>
{{end}}
