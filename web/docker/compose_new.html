{{define "page"}}

<nav>
    <a href="/docker/containers">containers</a>
    <a href="/docker/images">images</a>
    <a href="/docker/volumes">volumes</a>
    <a href="/docker/networks">networks</a>
    <a href="/docker/compose" class="active">compose</a>
    <a href="/docker/apps">apps</a>
</nav>

<h2>New ComposeUp</h2>

<form id="composeForm" class="form" action="/docker/compose/up" onsubmit="return submitCompose(event)">
    <div class="form-group">
        <label for="name">Project Name *</label>
        <input type="text" class="input" name="name" id="name" placeholder="e.g., myapp">
    </div>

    <div class="form-group">
        <label for="source_type">Source Type</label>
        <select class="input" name="source_type" id="source_type" onchange="toggleSourceFields()">
            <option value="file">Compose File Content</option>
            <option value="directory">Local Directory</option>
            <option value="repository">Git Repository</option>
        </select>
    </div>

    <!-- Compose File Content Field -->
    <div class="form-group" id="file_field">
        <label for="compose_content">Docker Compose Configuration</label>
        <textarea class="input" name="compose" id="compose_content" rows="15"
            placeholder="version: '3.8'&#10;services:&#10;  web:&#10;    image: nginx:latest&#10;    ports:&#10;      - &quot;8080:80&quot;"></textarea>
        <small class="form-hint">Paste your docker-compose.yml content here</small>
    </div>

    <!-- Local Directory Field -->
    <div class="form-group" id="directory_field" style="display: none;">
        <label for="dir">Directory Path</label>
        <input type="text" class="input" name="dir" id="build_dir" placeholder="e.g., /path/to/your/project">
        <small class="form-hint">Absolute path to directory containing docker-compose.yml</small>
    </div>

    <!-- Git Repository Fields -->
    <div class="form-group" id="repository_field" style="display: none;">
        <label for="repo">Repository URL</label>
        <input type="text" class="input" name="repo" id="repo_url" placeholder="e.g., https://github.com/user/repo.git">
    </div>
    <div class="form-group" id="branch_field" style="display: none;">
        <label for="branch">Branch (optional)</label>
        <input type="text" class="input" name="branch" id="branch" placeholder="e.g., main (defaults to default branch)">
    </div>

    <div class="form-group form-actions">
        <button type="submit" class="button button-primary" id="submitBtn">Create & Start</button>
        <button type="button" class="button button-secondary" id="cancelBtn" style="display: none;" onclick="cancelCompose()">Cancel</button>
        <a href="/docker/compose" class="button">Back</a>
    </div>
</form>

<div id="logContainer" style="display: none;">
    <h3>Compose Up Logs</h3>
    <log-viewer id="logs" dark max-height="500px"></log-viewer>
</div>

<script src="/assets/js/sse-client.js"></script>
<script src="/assets/js/log-viewer.js"></script>
<script>
let sseClient = null;

function toggleSourceFields() {
    const sourceType = document.getElementById('source_type').value;
    const fileField = document.getElementById('file_field');
    const directoryField = document.getElementById('directory_field');
    const repositoryField = document.getElementById('repository_field');
    const branchField = document.getElementById('branch_field');

    fileField.style.display = 'none';
    directoryField.style.display = 'none';
    repositoryField.style.display = 'none';
    branchField.style.display = 'none';

    document.getElementById('compose_content').removeAttribute('required');
    document.getElementById('build_dir').removeAttribute('required');
    document.getElementById('repo_url').removeAttribute('required');

    if (sourceType === 'file') {
        fileField.style.display = 'block';
        document.getElementById('compose_content').setAttribute('required', 'required');
    } else if (sourceType === 'directory') {
        directoryField.style.display = 'block';
        document.getElementById('build_dir').setAttribute('required', 'required');
    } else if (sourceType === 'repository') {
        repositoryField.style.display = 'block';
        branchField.style.display = 'block';
        document.getElementById('repo_url').setAttribute('required', 'required');
    }
}

function onComposeEvent(eventType, data) {
    const viewer = document.getElementById('logs');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    switch (eventType) {
    case 'connected':
        viewer.printlnf('ℹ️ %s', data);
        break;
    case 'log':
        viewer.println(data);
        break;
    case 'error':
        viewer.printlnf('❌ ERROR: %s', data);
        submitBtn.disabled = false;
        submitBtn.style.display = 'inline-block';
        cancelBtn.style.display = 'none';
        break;
    case 'complete':
        viewer.printlnf('✅ %s', data);
        submitBtn.disabled = false;
        submitBtn.style.display = 'inline-block';
        cancelBtn.style.display = 'none';
        setTimeout(() => { window.location.href = '/docker/compose'; }, 2000);
        break;
    }
}

function onComposeError(error) {
    const viewer = document.getElementById('logs');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    viewer.printlnf('❌ ERROR: %s', error.message);
    submitBtn.disabled = false;
    submitBtn.style.display = 'inline-block';
    cancelBtn.style.display = 'none';
}

function onComposeDone() {
    sseClient = null;
}

async function submitCompose(event) {
    event.preventDefault();

    const form = document.getElementById('composeForm');
    const formData = new FormData(form);
    const viewer = document.getElementById('logs');
    const logContainer = document.getElementById('logContainer');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    viewer.clear();
    logContainer.style.display = 'block';
    submitBtn.disabled = true;
    submitBtn.style.display = 'none';
    cancelBtn.style.display = 'inline-block';

    sseClient = new SSEClient('/docker/compose/up', {
        method: 'POST',
        body: formData,
        onEvent: onComposeEvent,
        onError: onComposeError,
        onDone: onComposeDone,
    });

    await sseClient.start();
}

function cancelCompose() {
    if (sseClient) {
        sseClient.abort();
        sseClient = null;
    }
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').style.display = 'inline-block';
    document.getElementById('cancelBtn').style.display = 'none';
}
</script>

{{end}}
