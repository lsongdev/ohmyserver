{{define "page"}}

<nav>
    <a href="/docker/containers">containers</a>
    <a href="/docker/images">images</a>
    <a href="/docker/volumes">volumes</a>
    <a href="/docker/networks">networks</a>
  <a href="/docker/compose">compose</a>
  <a href="/apps">apps</a>
</nav>

<h2>Build Image</h2>
<form id="buildForm" class="form" onsubmit="return submitBuild(event)">
    <div class="form-group">
        <label for="name">Image Name</label>
        <input type="text" class="input" name="name" id="name" required placeholder="e.g., myapp:latest">
    </div>
    
    <div class="form-group">
        <label for="source_type">Source Type</label>
        <select class="input" name="source_type" id="source_type" onchange="toggleSourceFields()">
            <option value="dockerfile">Dockerfile Content</option>
            <option value="directory">Local Directory</option>
            <option value="repository">Git Repository</option>
        </select>
    </div>
    
    <!-- Dockerfile Content Field -->
    <div class="form-group" id="dockerfile_field">
        <label for="dockerfile">Dockerfile</label>
        <textarea class="input" name="dockerfile" id="dockerfile" rows="10"
            placeholder="FROM node:18&#10;WORKDIR /app&#10;COPY . .&#10;RUN npm install&#10;CMD ['npm', 'start']"></textarea>
    </div>
    
    <!-- Local Directory Field -->
    <div class="form-group" id="directory_field" style="display: none;">
        <label for="build_dir">Build Directory</label>
        <input type="text" class="input" name="build_dir" id="build_dir" placeholder="e.g., /path/to/your/project">
        <small class="form-hint">Absolute path to directory containing Dockerfile</small>
    </div>
    
    <!-- Git Repository Fields -->
    <div class="form-group" id="repository_field" style="display: none;">
        <label for="repo_url">Repository URL</label>
        <input type="text" class="input" name="repo_url" id="repo_url" placeholder="e.g., https://github.com/user/repo.git">
    </div>
    <div class="form-group" id="branch_field" style="display: none;">
        <label for="branch">Branch (optional)</label>
        <input type="text" class="input" name="branch" id="branch" placeholder="e.g., main (defaults to default branch)">
    </div>
    
    <div class="form-group form-actions">
        <button type="submit" class="button button-primary">Build</button>
        <a href="/docker/images" class="button">Cancel</a>
    </div>
</form>

<div id="logContainer" style="display: none;">
    <h3>Build Logs</h3>
    <log-viewer id="logs" dark max-height="500px"></log-viewer>
</div>

<script src="/assets/js/sse-client.js"></script>
<script src="/assets/js/log-viewer.js"></script>
<script>
let sseClient = null;

function toggleSourceFields() {
    const sourceType = document.getElementById('source_type').value;
    const dockerfileField = document.getElementById('dockerfile_field');
    const directoryField = document.getElementById('directory_field');
    const repositoryField = document.getElementById('repository_field');
    const branchField = document.getElementById('branch_field');

    dockerfileField.style.display = 'none';
    directoryField.style.display = 'none';
    repositoryField.style.display = 'none';
    branchField.style.display = 'none';

    document.getElementById('dockerfile').removeAttribute('required');
    document.getElementById('build_dir').removeAttribute('required');
    document.getElementById('repo_url').removeAttribute('required');

    if (sourceType === 'dockerfile') {
        dockerfileField.style.display = 'block';
        document.getElementById('dockerfile').setAttribute('required', 'required');
    } else if (sourceType === 'directory') {
        directoryField.style.display = 'block';
        document.getElementById('build_dir').setAttribute('required', 'required');
    } else if (sourceType === 'repository') {
        repositoryField.style.display = 'block';
        branchField.style.display = 'block';
        document.getElementById('repo_url').setAttribute('required', 'required');
    }
}

function onBuildEvent(eventType, data) {
    const viewer = document.getElementById('logs');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    if (eventType === 'log') {
        viewer.println(data);
    } else if (eventType === 'error') {
        viewer.printlnf('❌ ERROR: %s', data);
        submitBtn.disabled = false;
        submitBtn.style.display = 'inline-block';
        cancelBtn.style.display = 'none';
    } else if (eventType === 'done') {
        viewer.printlnf('✅ %s', data);
        submitBtn.disabled = false;
        submitBtn.style.display = 'inline-block';
        cancelBtn.style.display = 'none';
    }
}

function onBuildError(error) {
    const viewer = document.getElementById('logs');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    viewer.printlnf('❌ ERROR: %s', error.message);
    submitBtn.disabled = false;
    submitBtn.style.display = 'inline-block';
    cancelBtn.style.display = 'none';
}

function onBuildDone() {
    sseClient = null;
}

async function submitBuild(event) {
    event.preventDefault();

    const form = document.getElementById('buildForm');
    const formData = new FormData(form);
    const viewer = document.getElementById('logs');
    const logContainer = document.getElementById('logContainer');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    viewer.clear();
    logContainer.style.display = 'block';
    submitBtn.disabled = true;
    submitBtn.style.display = 'none';
    cancelBtn.style.display = 'inline-block';

    sseClient = new SSEClient('/docker/images/build', {
        method: 'POST',
        body: formData,
        onEvent: onBuildEvent,
        onError: onBuildError,
        onDone: onBuildDone,
    });

    await sseClient.start();
}

function cancelBuild() {
    if (sseClient) {
        sseClient.abort();
        sseClient = null;
    }
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').style.display = 'inline-block';
    document.getElementById('cancelBtn').style.display = 'none';
}
</script>

{{end}}
