<h2>Create Network</h2>
<form action="/networks" method="POST" class="form">
    <div class="form-group">
        <label for="name">Network Name</label>
        <input type="text" class="input" id="name" name="name" required>
    </div>
    <div class="form-group">
        <label for="driver">Driver</label>
        <input type="text" class="input" id="driver" name="driver" required>
    </div>
    <div class="form-group">
        <label for="subnet">Subnet</label>
        <input type="text" class="input" id="subnet" name="subnet" required>
    </div>
    <div class="form-group">
        <label for="gateway">Gateway</label>
        <input type="text" class="input" id="gateway" name="gateway" required>
    </div>
    <div class="form-group">
        <label for="iprange">IP Range</label>
        <input type="text" class="input" id="iprange" name="iprange" required>
    </div>
    <div class="form-actions">
        <button type="submit" class="button button-primary">Create</button>
        <a href="" class="button button-secondry">Back</a>
    </div>
</form>
{{end}}
