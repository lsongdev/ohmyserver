{{define "page"}}
 
<nav>
  <a href="/docker/containers">containers</a>
  <a href="/docker/images">images</a>
  <a href="/docker/volumes">volumes</a>
  <a href="/docker/networks">networks</a>
  <a href="/docker/compose">compose</a>
  <a href="/docker/apps">apps</a>
</nav>

<div class="page-header">
  <h2>Images</h2>
  <div>
    <a href="/docker/images/pull">Pull Image</a>
    <a href="/docker/images/build">Build Image</a>
  </div>
</div>

<div class="table-container">
<table class="table table-striped table-bordered table-nowrap">
  <thead>
    <tr>
      <th>Name</th>
      <th>Size</th>
      <th>Created</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {{range .images}}
    <tr>
      <td><a>{{if .RepoTags}}{{index .RepoTags 0}}{{else}}<none>{{end}}</a></td>
      <td>{{formatSize .Size}}</td>
      <td>{{formatTime .Created}}</td>
      <td>
        <a href="">push</a>
        <a method="DELETE" href="/docker/images?id={{.ID}}">delete</a>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
</div>


{{end}}
