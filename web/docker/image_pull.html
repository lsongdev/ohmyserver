<h2>Pull Image</h2>
<form id="pullForm" action="/docker/images/pull" method="POST" class="form">
    <div class="form-group">
        <label for="name">Image Name</label>
        <input type="text" class="input" id="name" name="name" placeholder="alpine" required>
        <small></small>
    </div>
    <div class="form-actions">
        <button type="submit" class="button button-primary">Pull</button>
        <a href="/docker/images" class="button button-secondry">Cancel</a>
    </div>
</form>

<div id="logs" style="display: none;">
    <h2>Logs</h2>
    <log-viewer id="logViewer" dark max-height="400px"></log-viewer>
</div>

<script src="/assets/js/log-viewer.js"></script>
<script>
    document.getElementById('pullForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const name = e.target.querySelector('[name=name]').value;
        const logViewer = document.getElementById('logViewer');
        document.getElementById('logs').style.display = 'block';
        logViewer.connect('/docker/images/pull?name=' + encodeURIComponent(name));
        logViewer.addEventListener('completed', () => {
            // Optional: auto-refresh after completion
            // setTimeout(() => window.location.reload(), 1000);
        });
    });
</script>

{{end}}
