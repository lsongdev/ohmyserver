<h2>Create Volume</h2>
<form action="/volumes" method="POST" class="form">
    <div class="form-group">
        <label for="name">Volume Name</label>
        <input type="text" class="input" id="name" name="name" required placeholder="name">
    </div>
    <div class="form-group">
        <label for="driver">Volume Driver</label>
        <input type="text" class="input" id="driver" name="driver" required placeholder="driver">
    </div>
    <div class="form-group form-actions">
        <input type="submit" class="button button-primary" value="Create">
        <a href="/docker/volumes" class="button button-secondry">Back</a>
    </div>
</form>
{{end}}
