{{define "page"}}

<nav>
    <a href="/acme/certificates">certificates</a>
    
    <a href="/acme/providers">authorities</a>
    <a href="/acme/accounts">accounts</a>
    <a href="/acme/orders">orders</a>
</nav>

<h2>New Certificate Order</h2>

<form method="POST" action="/acme/orders" class="form">
    <div class="form-group">
        <label for="account_id">ACME Account</label>
        <select class="input" id="account_id" name="account_id" required>
            {{range .accounts}}
            <option value="{{.ID}}">{{.ProviderName}} - {{.Email}} ({{.Status}})</option>
            {{end}}
        </select>
        <small class="text-muted">Select the ACME account to use for this order</small>
    </div>

    <!-- <div class="form-group">
        <label for="cert_id">Certificate (CSR)</label>
        <select class="input" name="cert_id" id="cert_id">
            <option value="">-- Select a Certificate (optional) --</option>
            {{range .certificates}}
            <option value="{{.ID}}"
                    data-domains="{{.Domains}}">
                {{.ID}}: {{.Domains}}
            </option>
            {{end}}
        </select>
        <small class="text-muted">Select a certificate/CSR to auto-fill domains (optional)</small>
    </div> -->

    <div class="form-group">
        
        <div class="flex flex-jc-between items-center">
            <label for="domains">Domain Names</label>
            <select class="input" name="cert_id" id="cert_id">
                <option value="">-- Select a Certificate (optional) --</option>
                {{range .certificates}}
                <option value="{{.ID}}"
                        data-domains="{{.Domains}}">
                    {{.ID}}: {{.Domains}}
                </option>
                {{end}}
            </select>
        </div>
        <textarea class="input" id="domains" name="domains" rows="6" required
            placeholder="example.com&#10;www.example.com&#10;api.example.com"></textarea>
        <small class="text-muted">Enter one domain per line (first domain will be the primary). Auto-filled when CSR is selected.</small>
    </div>

    <div class="form-actions">
        <button type="submit" class="button button-primary">Create Order</button>
        <a href="/acme/orders" class="button">Cancel</a>
    </div>
</form>

<script>
    document.getElementById('cert_id').addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        const domainsTextarea = document.getElementById('domains');

        if (selectedOption.value) {
            const domainsStr = selectedOption.getAttribute('data-domains');
            if (domainsStr) {
                // Convert comma-separated domains to one per line
                domainsTextarea.value = domainsStr.split(',').map(d => d.trim()).join('\n');
            }
        } else {
            domainsTextarea.value = '';
        }
    });
</script>
{{end}}
