{{define "page"}}

<nav>
    <a href="/acme/certificates">certificates</a>
    
    <a href="/acme/providers">authorities</a>
    <a href="/acme/accounts">accounts</a>
    <a href="/acme/orders">orders</a>
</nav>

<h2>Add ACME Provider</h2>

<form method="POST" action="/acme/providers" class="form">
    <div class="form-group">
        <label for="name">Name</label>
        <input class="input" type="text" id="name" name="name" required placeholder="e.g., Let's Encrypt">
    </div>

    <div class="form-group">
        <label for="directory_url">Directory URL</label>
        <input class="input" type="url" id="directory_url" name="directory_url" datalist="directory_urls" required
            placeholder="https://acme-v02.api.letsencrypt.org/directory">
        <datalist id="directory_urls">
            <option value="https://acme-v02.api.letsencrypt.org/directory">Let's Encrypt</option>
            <option value="https://acme-staging-v02.api.letsencrypt.org/directory">Let's Encrypt Staging</option>
            <option value="https://acme.zerossl.com/v2/DV90">ZeroSSL</option>
            <option value="https://api.buypass.com/acme/directory">Buypass</option>
        </datalist>
    </div>

    <div class="form-actions">
        <button type="submit" class="button button-primary">Add Provider</button>
        <a href="/acme/providers" class="button button-secondary">Cancel</a>
    </div>
</form>
{{end}}
