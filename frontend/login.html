<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · OhMyServer</title>
    <link rel="stylesheet" href="https://lsong.org/stylesheets/index.css">
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
      main { width: min(100%, 28rem); }
      form { display: grid; gap: 1rem; }
      h1 { margin: 0 0 1.25rem; }
      .error { color: #b42318; }
    </style>
  </head>
  <body>
    <main>
      <h1>登录 OhMyServer</h1>
      <form method="post" action="">
        <label for="access_key">访问密钥</label>
        <input class="input" type="password" id="access_key" name="access_key" autocomplete="current-password" required autofocus>
        <p class="error" hidden>访问密钥无效，请重试。</p>
        <button class="button button-primary" type="submit">登录</button>
      </form>
    </main>
    <script>
      if (new URLSearchParams(location.search).get('error') === 'invalid') document.querySelector('.error').hidden = false;
    </script>
  </body>
</html>
